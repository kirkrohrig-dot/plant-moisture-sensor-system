esphome:
  name: plant-sensor-hub
  friendly_name: Plant Sensor Hub

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

# =========================================================
# ZIGBEE
# =========================================================

zigbee:
  id: bravo_zigbee
  model: "Plant Sensor Hub"
  router: false
  power_source: DC_SOURCE

# =========================================================
# SENSORS
# =========================================================

sensor:
  - platform: adc
    pin: GPIO0
    id: plant_1_voltage
    name: "Plant 1 Voltage"
    attenuation: auto
    update_interval: 60s
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1


  - platform: adc
    pin: GPIO1
    id: plant_2_voltage
    name: "Plant 2 Voltage"
    attenuation: auto
    update_interval: 60s
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1


  - platform: adc
    pin: GPIO2
    id: plant_3_voltage
    name: "Plant 3 Voltage"
    attenuation: auto
    update_interval: 60s
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1






