    sensor:
      - name: "Plant 1 Moisture"
        unique_id: plant_1_moisture
        unit_of_measurement: "%"
        state_class: measurement

        availability: >
          {% set voltage =
            states('sensor.plant_hub_plant_1_voltage') | float(none) %}
          {% set dry =
            states('input_number.plant_1_dry_calibration') | float(none) %}
          {% set wet =
            states('input_number.plant_1_wet_calibration') | float(none) %}

          {{ voltage is not none
             and dry is not none
             and wet is not none
             and voltage > 0.10
             and dry > wet }}

        state: >
          {% set voltage =
            states('sensor.plant_hub_plant_1_voltage') | float %}
          {% set dry =
            states('input_number.plant_1_dry_calibration') | float %}
          {% set wet =
            states('input_number.plant_1_wet_calibration') | float %}
          {% set moisture =
            ((dry - voltage) / (dry - wet) * 100) %}

          {{ [[moisture, 0] | max, 100] | min | round(0) }}
    
